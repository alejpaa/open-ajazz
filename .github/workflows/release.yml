name: Release Multiplataforma OpenAJAZZ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            os_name: 'macOS-AppleSilicon'
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            os_name: 'macOS-Intel'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            os_name: 'Linux-x86_64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias del Sistema en Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Instalar Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Instalar Dependencias Frontend
        run: npm ci || npm install

      - name: Construir y Empaquetar con Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenAJAZZ ${{ github.ref_name }}'
          releaseBody: |
            ## OpenAJAZZ Release ${{ github.ref_name }}
            Suite open source para mouse AJAZZ AJ159/AJ179 APEX con pantalla TFT, DPI y colores.

            ### Instalación en macOS:
            1. Descargar el archivo `.dmg` correspondiente a tu arquitectura (Apple Silicon M1/M2/M3/M4 o Intel).
            2. Arrastrar a `Aplicaciones`.
            3. Si macOS muestra aviso de desarrollador no identificado:
               `xattr -cr /Applications/OpenAJAZZ.app`

            ### Instalación en Linux:
            1. Descargar el archivo `.AppImage` o `.deb`.
            2. Copiar las reglas udev:
               `sudo cp 99-ajazz-mouse.rules /etc/udev/rules.d/`
               `sudo udevadm control --reload-rules && sudo udevadm trigger`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
